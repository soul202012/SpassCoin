<head>

<title>SpassCoin</title>
<style>
:root{--bg:#0a0a0a;--card:#151515;--text:#f4f0e4;--muted:#a59d86;--accent:#d4af37;--accent-t:#111;--line:#2b2b2b;--green:#4cc274;--red:#ef6b5f;--soft:color-mix(in srgb,var(--accent) 14%,var(--card));color-scheme:dark}
:root[data-theme="light"]{--bg:#ffffff;--card:#f6f6f6;--text:#111;--muted:#6b6b6b;--line:#e2e2e2;--green:#1f8a4c;--red:#c93a2e;color-scheme:light}
*,*:before,*:after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45}
.wrap{max-width:720px;margin:0 auto;padding:0 14px calc(40px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:10;background:var(--bg);margin:0 -14px 14px;padding:max(10px,env(safe-area-inset-top)) 14px 0;border-bottom:1px solid var(--line)}
.top header{margin-bottom:6px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
header h1{margin:0;font-size:22px}
header .who{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.sub{color:var(--muted);margin:0 0 16px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.card h2{margin:0 0 10px;font-size:13px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.hero{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 60%,#fff));color:var(--accent-t);border:0}
.hero h2{color:color-mix(in srgb,var(--accent-t) 70%,transparent)}
.big{font-size:52px;font-weight:800;line-height:1.1}.big small{font-size:18px;font-weight:600;opacity:.7}
.hint{color:var(--muted);font-size:13px;margin:6px 0 0}
.hero .hint{color:color-mix(in srgb,var(--accent-t) 75%,transparent)}
button{font:inherit;font-weight:700;background:var(--accent);color:var(--accent-t);border:0;border-radius:12px;padding:12px 16px;cursor:pointer;min-height:44px}
button.sec{background:transparent;color:var(--text);border:1px solid var(--line)}
button.ok{background:var(--green);color:#fff}button.no{background:var(--red);color:#fff}
button.small{padding:6px 12px;min-height:34px;font-size:14px}
button:disabled{opacity:.5;cursor:default}
input,select{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;width:100%;margin-bottom:10px;min-height:44px}
input[type=range]{padding:0;min-height:30px;accent-color:var(--accent)}
input[type=checkbox]{width:22px;height:22px;min-height:0;margin:0;accent-color:var(--accent)}
input[type=color]{padding:2px;height:44px}
.row2{display:flex;gap:8px;align-items:flex-start}.row2>*{flex:1;min-width:0}.row2 input{margin:0}
.btns{display:flex;gap:8px;flex-wrap:wrap}.btns button{flex:1;min-width:90px}
.code{font-size:34px;font-weight:800;letter-spacing:.18em;text-align:center;background:var(--soft);border-radius:14px;padding:10px;margin:4px 0 10px;user-select:all}
.err{color:var(--red);margin:0 0 10px}.okmsg{color:var(--green);margin:0 0 10px}
.msg{color:var(--muted);text-align:center;padding:30px 0}
.list>.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.list>.item:first-child{border-top:0}
.item .main{flex:1;min-width:0}.item .t{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.item .d{color:var(--muted);font-size:13px}
.in{color:var(--green);font-weight:800}.out{color:var(--red);font-weight:800}
.ico{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;flex:none}
.ico.in{background:color-mix(in srgb,var(--green) 18%,transparent)}.ico.out{background:color-mix(in srgb,var(--red) 18%,transparent)}
.rank{width:30px;text-align:center;font-weight:800;color:var(--muted)}
.item.me{background:var(--soft);border-radius:12px;padding-left:8px;padding-right:8px}
.badge{font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--soft)}
.badge.approved{color:var(--green)}.badge.rejected{color:var(--red)}
nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:1;min-width:64px;background:transparent;color:var(--muted);border-radius:12px 12px 0 0;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;min-height:50px;border-bottom:3px solid transparent}

nav button.on{color:var(--text);border-bottom-color:var(--accent)}
.seg{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}.seg button{flex:1;background:var(--card);color:var(--text);border:1px solid var(--line)}.seg button.on{background:var(--accent);color:var(--accent-t);border-color:var(--accent)}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:6px 8px;border-top:1px solid var(--line);white-space:nowrap}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:20px;z-index:30}
.modal .box{background:var(--card);border-radius:20px;padding:24px;max-width:360px;width:100%;text-align:center;border:1px solid var(--line)}
.toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(84px + env(safe-area-inset-top));background:var(--text);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:600;font-size:14px;z-index:40;max-width:90vw;text-align:center}
.toast.bad{background:var(--red);color:#fff}
.lbl{font-weight:600;font-size:14px;margin-bottom:4px}.fld{margin-bottom:12px}
.bar{height:12px;border-radius:99px;background:var(--soft);overflow:hidden;margin:8px 0}.bar>div{height:100%;background:var(--accent)}
.stat{display:flex;justify-content:space-between;padding:4px 0;font-size:15px}.stat b{font-weight:800}
.sep{border-top:1px solid var(--line);margin:14px 0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}.kpi small{display:block;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em}.kpi b{font-size:26px}
details.sec2{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:12px;padding:0}
details.sec2>summary{padding:14px 16px;font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
details.sec2>summary::after{content:"▾";color:var(--muted)}
details.sec2[open]>summary::after{content:"▴"}
details.sec2>div{padding:0 16px 16px}
/* Kacheln */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{position:relative;background:linear-gradient(160deg,var(--soft),var(--card));border:1px solid var(--line);border-radius:18px;padding:16px 10px;text-align:center;cursor:pointer;overflow:hidden;min-height:156px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transition:transform .15s,border-color .15s}
.tile:hover{transform:translateY(-3px);border-color:var(--accent)}
.tile .ic{font-size:46px;line-height:1.1}.tile .nm{font-weight:800}.tile .ds{font-size:12px;color:var(--muted)}
.tile .live{font-size:12px;font-weight:700;color:var(--accent)}
.tile.locked{cursor:default}.tile.locked:hover{transform:none;border-color:var(--line)}
.tile .lock{position:absolute;inset:0;background:rgba(0,0,0,.62);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#fff;font-weight:700;font-size:13px;text-align:center;padding:8px}
.tile .lock span{font-size:34px}
.back{margin-bottom:12px}
/* Truhen */
.chests{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;position:relative;margin:12px 0}
.chest{aspect-ratio:1;padding:0;border-radius:16px;background:linear-gradient(135deg,#c98a2b,#8a5a17);color:#fff;border:2px solid #5f3d0e;display:flex;align-items:center;justify-content:center;transition:transform .24s ease,background .3s,border-color .3s}
.chest .face{display:flex;flex-direction:column;align-items:center;font-size:34px;line-height:1.1}
.chest .face small{font-size:16px;font-weight:800}
.chest.open{background:var(--soft);color:var(--text);border-color:var(--accent)}
.chest.bomb{background:color-mix(in srgb,var(--red) 22%,var(--card));border-color:var(--red);color:var(--text)}
.chest.dim{opacity:.55}.chest:disabled{opacity:1;cursor:default}.chest.dim:disabled{opacity:.55}
.chest.pop .face{animation:pop .4s}
@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
.runline{text-align:center;font-size:18px;font-weight:800;min-height:28px;margin-bottom:10px}
/* Rad */
.wheelbox{position:relative;max-width:340px;margin:10px auto 14px}.wheelbox svg{width:100%;height:auto;display:block}
.ptr{position:absolute;top:-8px;left:50%;transform:translateX(-50%);font-size:30px;line-height:1;z-index:2}
#wg{transform-origin:100px 100px}
.res{text-align:center;font-size:20px;font-weight:800;min-height:30px;margin:6px 0 12px}
/* Slot */
.slot{display:flex;gap:10px;justify-content:center;background:linear-gradient(#000,#1b1b1b);border:3px solid var(--accent);border-radius:18px;padding:14px;margin:10px auto;max-width:360px;box-shadow:0 0 24px color-mix(in srgb,var(--accent) 35%,transparent)}
.reel{width:92px;height:96px;overflow:hidden;background:#fff;border-radius:10px;position:relative}
.reel:after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.35),transparent 30%,transparent 70%,rgba(0,0,0,.35));pointer-events:none}
.strip>div{height:96px;display:flex;align-items:center;justify-content:center;font-size:52px;color:#111}
.paytable{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px;font-size:14px}
.paytable div{background:var(--soft);border-radius:10px;padding:6px 8px;text-align:center}
/* Blackjack */
.hand{display:flex;gap:8px;flex-wrap:wrap;min-height:96px;margin:6px 0}
.pcard{width:62px;height:90px;background:#fff;color:#111;border-radius:9px;border:1px solid #ccc;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:22px;line-height:1.1;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.pcard.red{color:#c62828}.pcard span{font-size:26px}
.pcard.back{background:repeating-linear-gradient(45deg,var(--accent) 0 6px,#111 6px 12px);border:2px solid #fff}
.pcard.deal{animation:deal .45s ease-out}
.pcard.flip{animation:flip .5s ease-out}
@keyframes deal{0%{transform:translate(60px,-80px) rotate(12deg) scale(.7);opacity:0}100%{transform:none;opacity:1}}
@keyframes flip{0%{transform:rotateY(90deg)}100%{transform:rotateY(0)}}
.total{font-weight:800;color:var(--muted);font-size:14px}
/* Rennen */
.track{background:var(--soft);border-radius:14px;padding:6px 0;overflow:hidden}
.lane{position:relative;height:42px;border-bottom:1px dashed var(--line)}.lane:last-child{border-bottom:0}
.lane:after{content:"";position:absolute;right:10px;top:0;bottom:0;border-right:4px dotted var(--text);opacity:.6}
.runner{position:absolute;top:4px;left:0;font-size:28px;line-height:34px;display:flex;align-items:center;gap:2px}
.runner i{width:10px;height:26px;border-radius:5px;display:inline-block}
.runner em{display:inline-block;transform:scaleX(-1);font-style:normal}
.dot{width:14px;height:14px;border-radius:50%;display:inline-block;flex:none}
.horse{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;cursor:pointer}
.horse.sel{border-color:var(--accent);background:var(--soft)}
.horse .nm{flex:1;font-weight:700}
.swatches{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sw{width:38px;height:38px;border-radius:50%;border:3px solid transparent;cursor:pointer;padding:0;min-height:0}
.sw.on{border-color:var(--text)}
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.srow:first-child{border-top:0}
</style>

<script>
// ====== HIER DEINE SUPABASE-DATEN EINTRAGEN (wie vorher) ======
var SUPABASE_URL='https://aghqqdpdtxeajuhfcveq.supabase.co';
var SUPABASE_KEY='sb_publishable_KJJa0IA9CgyU0SilXKWTaQ_8c-mFGLA';
// Hintergrundmusik: lege deine MP3-Datei hier ab (neben index.html):  assets/music.mp3
var MUSIC_PATH='assets/music.mp3';
// ==============================================================
(function(){
var root=document.getElementById('root');
var sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
var mode='login',err='',info='',busy=false,me=null,tab='home',gameView=null,loading=false,adminTab='overview';
var cleanup=[];
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function inp(ph,type,im){var i=el('input');i.placeholder=ph;i.type=type||'text';if(im)i.inputMode=im;return i}
function msg(x){root.innerHTML='';root.appendChild(el('p','msg',x))}
function toast(t,bad){var d=el('div','toast'+(bad?' bad':''),t);document.body.appendChild(d);setTimeout(function(){d.remove()},3200)}
function modal(title,text,icon){var m=el('div','modal'),b=el('div','box');b.appendChild(el('div','big',icon||'🎉'));b.appendChild(el('h2',null,title));b.appendChild(el('p',null,text));var ok=el('button',null,'Weiter');ok.onclick=function(){m.remove()};b.appendChild(ok);m.appendChild(b);document.body.appendChild(m)}
function cleanName(u){return u.trim().toLowerCase().replace(/[^a-z0-9_.-]/g,'')}
function fmt(d){return new Date(d).toLocaleString('de-CH',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})}
function zurich(o){return new Date(Date.now()+(o||0)*86400000).toLocaleDateString('sv-SE',{timeZone:'Europe/Zurich'})}
function errText(e){return (e&&e.message)?e.message:'Das hat nicht geklappt.'}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}
function r2(x){return Math.round(x*100)/100}
function sgn(x){x=r2(x);return (x>0?'+':'')+x}
function canAdmin(){return me&&(me.is_admin||me.is_test)}
function runCleanup(){cleanup.forEach(function(f){try{f()}catch(e){}});cleanup=[]}
function hms(ms){ms=Math.max(0,Math.floor(ms/1000));var h=Math.floor(ms/3600),m=Math.floor(ms%3600/60),s=ms%60;return (h?h+':':'')+String(m).padStart(h?2:1,'0')+':'+String(s).padStart(2,'0')}

/* ---------- Einstellungen, Theme, Musik ---------- */
var DEFAULTS={music_on:true,music_vol:0.4,sfx_on:true,theme:'dark',accent:'#d4af37'};
var S=Object.assign({},DEFAULTS);
function applyTheme(){
  var h=document.documentElement;h.setAttribute('data-theme',S.theme==='light'?'light':'dark');
  var c=/^#[0-9a-f]{6}$/i.test(S.accent)?S.accent:DEFAULTS.accent;
  var r=parseInt(c.substr(1,2),16),g=parseInt(c.substr(3,2),16),b=parseInt(c.substr(5,2),16);
  var lum=(0.299*r+0.587*g+0.114*b)/255;
  h.style.setProperty('--accent',c);h.style.setProperty('--accent-t',lum>0.6?'#111111':'#ffffff');
}
var music=new Audio(MUSIC_PATH);music.loop=true;music.preload='none';
var musicMissing=false,musicStarted=false;
music.addEventListener('error',function(){musicMissing=true;var n=document.getElementById('musichint');if(n)n.style.display='block'});
function applyMusic(){
  music.volume=Math.max(0,Math.min(1,Number(S.music_vol)||0));
  if(S.music_on&&musicStarted){var p=music.play();if(p&&p.catch)p.catch(function(){})}else music.pause();
}
document.addEventListener('pointerdown',function(){if(!musicStarted){musicStarted=true;applyMusic()}},true);
var saveTimer=null;
function saveSettings(){
  applyTheme();applyMusic();
  try{if(me)localStorage.setItem('sc_set_'+me.id,JSON.stringify(S))}catch(e){}
  clearTimeout(saveTimer);
  saveTimer=setTimeout(function(){if(me)sb.rpc('save_my_settings',{p_settings:S}).then(function(){},function(){})},600);
}
function loadSettings(){
  var local={};try{local=JSON.parse(localStorage.getItem('sc_set_'+me.id)||'{}')}catch(e){}
  var remote=(me.settings&&typeof me.settings==='object')?me.settings:{};
  S=Object.assign({},DEFAULTS,local,remote);applyTheme();applyMusic();
}
applyTheme();

/* ---------- Soundeffekte (selbst erzeugt mit der Web Audio API, keine Fremddateien) ---------- */
var AC=null;
function ac(){if(!AC){var C=window.AudioContext||window.webkitAudioContext;if(C)AC=new C()}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,d,type,v,when,slide){
  if(!S.sfx_on)return;var a=ac();if(!a)return;var t=a.currentTime+(when||0),o=a.createOscillator(),g=a.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime((v||.2)*.8,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.03);
}
function noise(d,v,when,ft,f){
  if(!S.sfx_on)return;var a=ac();if(!a)return;var t=a.currentTime+(when||0),n=Math.floor(a.sampleRate*d),buf=a.createBuffer(1,n,a.sampleRate),dt=buf.getChannelData(0);
  for(var i=0;i<n;i++)dt[i]=Math.random()*2-1;
  var s=a.createBufferSource();s.buffer=buf;var fl=a.createBiquadFilter();fl.type=ft||'lowpass';fl.frequency.value=f||1000;
  var g=a.createGain();g.gain.setValueAtTime((v||.3)*.8,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  s.connect(fl);fl.connect(g);g.connect(a.destination);s.start(t);
}
var sfx={
  click:function(){tone(640,.05,'square',.07)},
  tick:function(){tone(900,.03,'square',.05)},
  stop:function(){tone(180,.12,'triangle',.25,0,90)},
  chest:function(){tone(260,.12,'triangle',.18,0,520)},
  coin:function(){tone(1318,.08,'square',.1);tone(1760,.2,'square',.1,.08)},
  win:function(){[523,659,784,1047].forEach(function(f,i){tone(f,.18,'triangle',.18,i*.1)});sfx.coin()},
  big:function(){[523,659,784,1047,1319,1568].forEach(function(f,i){tone(f,.2,'triangle',.2,i*.09)})},
  lose:function(){tone(300,.4,'sawtooth',.14,0,110)},
  bomb:function(){noise(.8,.6,0,'lowpass',500);tone(110,.6,'sawtooth',.3,0,35)},
  card:function(){noise(.07,.3,0,'highpass',2500)},
  spin:function(){for(var i=0;i<10;i++)tone(500+i*40,.05,'square',.04,i*.12)},
  gun:function(){noise(.25,.5,0,'highpass',1200);tone(880,.3,'square',.1,.05)},
  hoof:function(){tone(110,.06,'sine',.18,0,70);tone(95,.06,'sine',.14,.09,60)}
};
document.addEventListener('click',function(e){if(e.target.closest&&e.target.closest('button,.tile:not(.locked),.horse'))sfx.click()},true);

/* ---------- Anmeldung ---------- */
function renderAuth(){
  root.innerHTML='';
  var h=el('header');h.appendChild(el('h1',null,'🪙 SpassCoin'));root.appendChild(h);
  root.appendChild(el('p','sub','Unser Spass-Coin. Alle Coins sind rein digital und nur zum Spass.'));
  var c=el('div','card');c.appendChild(el('h2',null,mode==='login'?'Anmelden':'Konto erstellen'));
  var u=inp(mode==='login'?'Benutzername oder E-Mail':'Benutzername'),em=inp('E-Mail','email'),p=inp('Passwort','password');
  u.autocapitalize='none';
  c.appendChild(u);if(mode==='register')c.appendChild(em);c.appendChild(p);
  if(err)c.appendChild(el('p','err',err));if(info)c.appendChild(el('p','okmsg',info));
  var go=el('button',null,mode==='login'?'Anmelden':'Registrieren');go.style.width='100%';go.disabled=busy;
  go.onclick=async function(){
    err='';info='';go.disabled=true;
    try{
      if(mode==='login'){
        var login=u.value.trim(),email=login;
        if(!login||!p.value)throw 'Bitte alles ausfüllen.';
        if(login.indexOf('@')<0){
          var r=await sb.rpc('email_for_username',{uname:login});
          if(!r.data)throw 'Benutzername oder Passwort stimmt nicht.';
          email=r.data;
        }
        var s=await sb.auth.signInWithPassword({email:email,password:p.value});
        if(s.error)throw 'Benutzername oder Passwort stimmt nicht (oder die E-Mail ist noch nicht bestätigt).';
      }else{
        var name=cleanName(u.value),mail=em.value.trim();

async function initChest(box){

}
function setCell(i,state,v,dim){

  c.className='chest'+(state!=='closed'?' open':'')+(state==='bomb'?' bomb':'')+(dim?' dim':'');
  if(state==='closed')f.textContent='🎁';
  else if(state==='bomb')f.textContent='💣';
  else{f.appendChild(document.createTextNode('🪙'));f.appendChild(el('small',null,'+'+v))}
}
function applyPos(){
  if(!ch||!ch.cells.length)return;
  ch.cells.forEach(function(o,i){var t=ch.cells[ch.slot[i]];o.style.transform='translate('+(t.offsetLeft-o.offsetLeft)+'px,'+(t.offsetTop-o.offsetTop)+'px)'});
}
window.addEventListener('resize',applyPos);
function buildChest(){
  var box=ch.box;box.innerHTML='';
  var c=el('div','card');c.appendChild(el('h2',null,'Truhen-Spiel'));
  ch.info=el('p','hint');c.appendChild(ch.info);
  var grid=el('div','chests');ch.cells=[];ch.slot=[];
  for(var i=0;i<12;i++){(function(i){
    var d=el('button','chest');d.type='button';d.appendChild(el('div','face'));
    d.onclick=function(){openChest(i)};
    ch.cells.push(d);ch.slot.push(i);grid.appendChild(d);setCell(i,'closed');
  })(i)}
  c.appendChild(grid);
  ch.run=el('div','runline');c.appendChild(ch.run);
  ch.act=el('div','btns');c.appendChild(ch.act);
  var rules=el('p','hint','Du siehst zuerst, was in den Truhen ist. Dann werden sie gemischt und du öffnest sie nacheinander. Eine Bombe zerstört deinen ganzen Gewinn und den Einsatz. Du kannst nach jeder Truhe aussteigen. Die Inhalte werden nach dem Mischen zufällig verteilt.');
  rules.style.marginTop='12px';c.appendChild(rules);
  box.appendChild(c);
  if(ch.phase==='play')Object.keys(ch.opened).forEach(function(k){setCell(+k,'coin',ch.opened[k])});
  updateChest();
}
function updateChest(){
  ch.cells.forEach(function(c,i){c.disabled=ch.phase!=='play'||ch.opened[i]!==undefined||!!ch.busy});
  ch.act.innerHTML='';
  var st=ch.stake+(ch.stake===1?' Coin':' Coins');
  if(ch.phase==='idle'){
    ch.info.textContent='Einsatz pro Spiel: '+st+'.';ch.run.textContent='';
    var b=el('button',null,'Spiel starten');b.onclick=startChest;ch.act.appendChild(b);
  }else if(ch.phase==='preview'){ch.info.textContent='Merk dir, was in den Truhen ist …';ch.run.textContent='';}
  else if(ch.phase==='shuffle'){ch.info.textContent='Die Truhen werden gemischt …';ch.run.textContent='';}
  else if(ch.phase==='play'){
    var n=Object.keys(ch.opened).length;
    ch.info.textContent='Wähle eine Truhe. Einsatz: '+st+'.';
    ch.run.textContent='Gewinn bisher: '+ch.running+(ch.running===1?' Coin':' Coins');
    var o=el('button','ok','Aussteigen: +'+ch.running+' Coins einlösen');o.disabled=n===0||!!ch.busy;o.onclick=cashChest;ch.act.appendChild(o);
  }else if(ch.phase==='over'){
    var a=el('button',null,'Nochmal spielen');a.onclick=chestAgain;ch.act.appendChild(a);
  }
}
function chestAgain(){ch.phase='idle';ch.opened={};ch.running=0;buildChest()}
async function startChest(){
  var r=await sb.rpc('chest_start');
  if(r.error){return toast(errText(r.error),true)}
  ch.id=r.data.id;ch.stake=r.data.stake;ch.opened={};ch.running=0;me.balance=Number(r.data.balance);setBal();
  ch.phase='preview';
  ch.cells.forEach(function(c,i){var v=r.data.preview[i];setCell(i,v<0?'bomb':'coin',v)});
  updateChest();
  var alive=true;cleanup.push(function(){alive=false});
  await sleep(4000);if(!alive)return;
  ch.cells.forEach(function(c,i){setCell(i,'closed')});
  ch.phase='shuffle';updateChest();
  for(var n=0;n<16&&alive;n++){
    var a=Math.floor(Math.random()*12),b=(a+1+Math.floor(Math.random()*11))%12;
    var tmp=ch.slot[a];ch.slot[a]=ch.slot[b];ch.slot[b]=tmp;applyPos();sfx.card();
    await sleep(260);
  }
  if(!alive)return;await sleep(350);
  ch.phase='play';updateChest();
}

  ch.busy=false;

  if(d.result==='bomb'){
    sfx.bomb();

function chestEV(vals,bombs){
  var items=vals.concat(Array(bombs).fill(-1)),n=items.length,memo={};
  function V(mask){
    if(memo[mask]!==undefined)return memo[mask];
    var S=0,cnt=0,acc=0,i;
    for(i=0;i<n;i++)if(mask>>i&1&&items[i]>0)S+=items[i];
    for(i=0;i<n;i++)if(!(mask>>i&1)){cnt++;if(items[i]>0)acc+=V(mask|1<<i)}
    var cont=cnt?acc/cnt:0,res=mask===0?cont:Math.max(S,cont);memo[mask]=res;return res;
  }
  return {best:V(0),one:vals.reduce(function(s,v){return s+v},0)/n};
}
function nf(label,obj,key,opt,onChange){
  opt=opt||{};var w=el('div','fld');w.appendChild(el('div','lbl',label));
  var i=el('input');i.type='number';i.inputMode='decimal';if(opt.min!=null)i.min=opt.min;if(opt.step)i.step=opt.step;i.value=obj[key];i.style.marginBottom='0';
  i.oninput=function(){obj[key]=i.value===''?NaN:Number(i.value);onChange()};
  w.appendChild(i);if(opt.hint)w.appendChild(el('div','hint',opt.hint));return w;
}
function listEditor(arr,cols,newItem,fixed,onChange){
  var wrap=el('div');
  function draw(){
    wrap.innerHTML='';
    var head=el('div','row2');head.style.marginBottom='4px';
    cols.forEach(function(c){head.appendChild(el('div','hint',c.label))});
    if(!fixed){var sp=el('div');sp.style.flex='0 0 44px';head.appendChild(sp)}
    wrap.appendChild(head);
    arr.forEach(function(item,idx){
      var row=el('div','row2');row.style.marginBottom='6px';
      cols.forEach(function(c){
        var i=el('input');i.type=c.type||'number';if(c.step)i.step=c.step;if(c.min!=null)i.min=c.min;if(c.type==='text')i.maxLength=c.max||20;
        i.value=item[c.key];
        i.oninput=function(){item[c.key]=(c.type==='text'||c.type==='color')?i.value:(i.value===''?NaN:Number(i.value));onChange()};
        row.appendChild(i);
      });
      if(!fixed){var d=el('button','sec small','✗');d.style.flex='0 0 44px';d.onclick=function(){arr.splice(idx,1);draw();onChange()};row.appendChild(d)}
      wrap.appendChild(row);
    });
    if(!fixed){var add=el('button','sec small','+ hinzufügen');add.onclick=function(){arr.push(newItem());draw();onChange()};wrap.appendChild(add)}
  }
  draw();return wrap;
}
async function renderAdmin(){
  var ovr=await sb.rpc('admin_game_overview'),rq=await sb.rpc('admin_requests'),us=await sb.from('profiles').select('*').order('username');
  shell();
  if(ovr.error||!ovr.data){var n=el('div','card');n.appendChild(el('h2',null,'Admin'));n.appendChild(el('p',null,'Die Datenbank ist noch nicht eingerichtet. Führe supabase-bank.sql im SQL Editor aus.'));root.appendChild(n);return}
  var ov=ovr.data,reqs=rq.data||[],users=us.data||[];
  var seg=el('div','seg');
  [['overview','📊 Übersicht'],['requests','📥 Anfragen'+(reqs.length?' ('+reqs.length+')':'')],['accounts','👥 Konten'],['games','🎲 Spiele']].forEach(function(t){
    var b=el('button',adminTab===t[0]?'on':'',t[1]);b.onclick=function(){adminTab=t[0];render()};seg.appendChild(b)});
  root.appendChild(seg);
  if(adminTab==='requests')adminRequests(reqs);
  else if(adminTab==='accounts')adminAccounts(users);
  else if(adminTab==='games')adminGames(ov);
  else adminOverview(ov,reqs);
}
function adminOverview(ov,reqs){
  var k=el('div','kpis');
  [['Bank',ov.bank],['Im Umlauf',ov.circulating],['Spieler',ov.players],['Offene Anfragen',reqs.length]].forEach(function(x){
    var d=el('div','kpi');d.appendChild(el('small',null,x[0]));d.appendChild(el('b',null,String(x[1])));k.appendChild(d)});
  root.appendChild(k);
  var c=el('div','card');c.appendChild(el('h2',null,'Bank'));
  c.appendChild(el('p',null,'Gesamtmenge: '+ov.total+' Coins. Bank + Kontostände aller normalen Spieler = '+ov.total+'.'));
  var bar=el('div','bar'),fill=el('div');fill.style.width=Math.min(100,ov.bank_pct)+'%';bar.appendChild(fill);c.appendChild(bar);
  c.appendChild(el('p','hint','Die Bank hält '+ov.bank_pct+' % der Coins. Gewinne der Spieler kommen aus der Bank, Verluste fliessen zurück. Spieler sehen den Bankstand nicht.'));
  c.appendChild(el('p','hint','Admin- und Test-Konten zählen nicht zum Umlauf und erscheinen in keiner Statistik.'));
  root.appendChild(c);
}
function adminRequests(reqs){
  var rc=el('div','card');rc.appendChild(el('h2',null,'Offene Coin-Anfragen'));
  if(!reqs.length)rc.appendChild(el('p','hint','Keine offenen Anfragen.'));
  var l=el('div','list');
  reqs.forEach(function(x){
    var it=el('div','item'),m=el('div','main');
    m.appendChild(el('div','t',x.username+': '+x.amount+' Coins'));m.appendChild(el('div','d',fmt(x.created_at)));
    var ok=el('button','ok small','✓'),no=el('button','no small','✗');
    ok.title='Bestätigen';no.title='Ablehnen';
    async function decide(yes){ok.disabled=no.disabled=true;var r=await sb.rpc('decide_request',{p_id:x.req_id,p_approve:yes});if(r.error)toast(errText(r.error),true);else toast(yes?'Bestätigt, Coins aus der Bank gutgeschrieben':'Abgelehnt');render()}
    ok.onclick=function(){decide(true)};no.onclick=function(){decide(false)};
    it.appendChild(m);it.appendChild(ok);it.appendChild(no);l.appendChild(it)});
  rc.appendChild(l);root.appendChild(rc);
}
function adminAccounts(users){
  var c=el('div','card');c.appendChild(el('h2',null,'Konten'));
  c.appendChild(el('p','hint','Du kannst jeden Kontostand setzen oder ändern. Die Bank gleicht die Differenz automatisch aus, die Gesamtmenge bleibt gleich.'));
  root.appendChild(c);
  users.forEach(function(u){
    var d=el('details','sec2'),sm=el('summary');
    sm.appendChild(el('span',null,u.username+(u.is_test?' · Test':u.is_admin?' · Admin':'')));sm.appendChild(el('b',null,u.balance+' Coins'));
    d.appendChild(sm);
    var body=el('div');
    body.appendChild(el('p','hint',u.email+' · Code '+u.code+' · Streak '+u.streak));
    var amt=el('input');amt.type='number';amt.inputMode='numeric';amt.placeholder='Betrag';amt.min='0';
    var b=el('div','btns');
    async function go(mode,sign){
      var v=parseInt(amt.value,10);if(isNaN(v)||v<0)return toast('Bitte einen Betrag eingeben',true);
      var r=await sb.rpc('admin_set_balance',{p_user:u.id,p_mode:mode,p_amount:sign*v});
      if(r.error)toast(errText(r.error),true);else{toast('Kontostand: '+r.data+' Coins');render()}
    }
    var s1=el('button',null,'Setzen auf'),s2=el('button','ok','+ Addieren'),s3=el('button','no','− Abziehen');
    s1.onclick=function(){go('set',1)};s2.onclick=function(){go('add',1)};s3.onclick=function(){go('add',-1)};
    b.appendChild(s1);b.appendChild(s2);b.appendChild(s3);
    body.appendChild(amt);body.appendChild(b);d.appendChild(body);root.appendChild(d);
  });
  var ex=el('button',null,'Als Excel-Tabelle (CSV) speichern');ex.style.width='100%';
  ex.onclick=function(){
    var rows=[['Benutzername','E-Mail','Coins','Serie','Rolle','Registriert am']];
    users.forEach(function(x){rows.push([x.username,x.email,x.balance,x.streak,x.is_test?'Test':x.is_admin?'Admin':'Spieler',new Date(x.created_at).toLocaleDateString('de-CH')])});
    var csv='\ufeff'+rows.map(function(r){return r.map(csvCell).join(';')}).join('\r\n');
    var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='spasscoin-benutzer.csv';a.click();
  };
  root.appendChild(ex);
}
function adminGames(ov){
  var cfg=JSON.parse(JSON.stringify(ov.settings));
  cfg.wheel_fields.forEach(function(f){f.weight=Number(f.weight)});
  cfg.slot_symbols.forEach(function(f){f.weight=Number(f.weight);f.mult=Number(f.mult)});
  cfg.race_horses.forEach(function(f){f.weight=Number(f.weight);f.odds=Number(f.odds)});
  cfg.bj_blackjack_payout=Number(cfg.bj_blackjack_payout);cfg.bj_win_payout=Number(cfg.bj_win_payout);cfg.pool_strength=Number(cfg.pool_strength);
  var infos=[];
  function info(fn){var p=el('p','hint');infos.push(function(){p.textContent=fn()});return p}
  function recalc(){infos.forEach(function(f){f()})}
  function sec(title,open){var d=el('details','sec2');if(open)d.open=true;var s=el('summary');s.appendChild(el('span',null,title));d.appendChild(s);var b=el('div');d.appendChild(b);root.appendChild(d);return b}
  function sum(a){return a.reduce(function(s,x){return s+x.weight},0)}

  var g=sec('Bank und Anpassung',true);
  g.appendChild(el('p','hint','Bank jetzt: '+ov.bank+' von '+ov.total+' Coins ('+ov.bank_pct+' %). Die Gesamtmenge bleibt fix.'));
  var two=el('div','row2');
  two.appendChild(nf('Bank-Schwelle (%)',cfg,'pool_threshold',{min:1,hint:'Darüber: etwas bessere Chancen. Darunter: mehr Nieten und Bomben.'},recalc));
  two.appendChild(nf('Stärke der Anpassung',cfg,'pool_strength',{min:0,step:'0.5',hint:'0 = aus (empfohlen 3 bis 8)'},recalc));
  g.appendChild(two);

  var t=sec('🧰 Truhen-Spiel');
  var tw=el('div','row2');
  tw.appendChild(nf('Einsatz (Coins)',cfg,'chest_stake',{min:1},recalc));tw.appendChild(nf('Anzahl Bomben',cfg,'chest_bombs',{min:1},recalc));t.appendChild(tw);
  var iv=el('input');iv.value=cfg.chest_values.join(', ');iv.oninput=function(){cfg.chest_values=iv.value.split(/[\s,;]+/).filter(Boolean).map(Number);recalc()};
  t.appendChild(el('div','lbl','Truhenwerte (mit Komma, Anzahl = 12 minus Bomben)'));t.appendChild(iv);
  t.appendChild(info(function(){
    var v=cfg.chest_values,b=cfg.chest_bombs;
    if(v.length+b!==12||v.some(isNaN))return 'Truhenwerte ('+v.length+') plus Bomben ('+b+') müssen genau 12 ergeben.';
    var e=chestEV(v,b),cnt={};v.forEach(function(x){cnt[x]=(cnt[x]||0)+1});
    return 'Verteilung: '+b+' Bomben ('+r2(b/12*100)+' %), '+Object.keys(cnt).map(function(k){return cnt[k]+'× '+k}).join(', ')+' Coins. Erwartungswert: nur 1 Truhe '+sgn(e.one-cfg.chest_stake)+', beste Strategie '+sgn(e.best-cfg.chest_stake)+' Coins (0 = ausgeglichen).';
  }));

  var w=sec('🎡 Glücksrad');
  w.appendChild(nf('Einsatz pro Drehung (Coins)',cfg,'wheel_stake',{min:1},recalc));
  w.appendChild(el('p','hint','Auszahlung = Coins, die man zurückbekommt. 0 = Niete, gleich wie der Einsatz = ±0, mehr = Gewinn.'));
  w.appendChild(listEditor(cfg.wheel_fields,[{key:'payout',label:'Auszahlung',min:0,step:1},{key:'weight',label:'Chance (%)',min:0,step:'0.1'}],function(){return {payout:1,weight:1}},false,recalc));
  w.appendChild(info(function(){var ev=cfg.wheel_fields.reduce(function(s,f){return s+f.weight/100*f.payout},0);return 'Summe der Chancen: '+r2(sum(cfg.wheel_fields))+' % (muss 100 sein) · Erwartungswert pro Drehung: '+sgn(ev-cfg.wheel_stake)+' Coins (0 = ausgeglichen)'}));

  var s=sec('🎰 Slotmaschine');
  s.appendChild(el('p','hint','Drei gleiche Symbole gewinnen. Gewinnfaktor = Auszahlung mal Einsatz. Jede Walze zieht unabhängig mit den Chancen unten.'));
  s.appendChild(listEditor(cfg.slot_symbols,[{key:'symbol',label:'Symbol',type:'text',max:8},{key:'weight',label:'Chance (%)',min:0,step:'0.1'},{key:'mult',label:'Gewinnfaktor ×',min:0,step:'1'}],function(){return {symbol:'🍀',weight:1,mult:10}},false,recalc));
  s.appendChild(info(function(){
    var tot=sum(cfg.slot_symbols);if(!(tot>0))return '';
    var ev=0,hit=0;cfg.slot_symbols.forEach(function(x){var p=x.weight/tot;ev+=Math.pow(p,3)*x.mult;hit+=Math.pow(p,3)});
    return 'Summe der Chancen: '+r2(tot)+' % (muss 100 sein) · Trefferchance: '+r2(hit*100)+' % · Erwartungswert pro Coin Einsatz: '+sgn(ev-1)+' Coins (0 = ausgeglichen)';
  }));

  var b=sec('🃏 Blackjack');
  var bw=el('div','row2');
  bw.appendChild(nf('Blackjack zahlt (Gewinn × Einsatz)',cfg,'bj_blackjack_payout',{min:1,step:'0.1',hint:'1.5 = 3:2'},recalc));
  bw.appendChild(nf('Normaler Gewinn (× Einsatz)',cfg,'bj_win_payout',{min:0.5,step:'0.1',hint:'1 = doppelter Einsatz zurück'},recalc));
  b.appendChild(bw);
  var sw=el('div','srow');sw.appendChild(el('span',null,'Dealer zieht bei weichen 17 (Ass als 11) weiter'));
  var cb=el('input');cb.type='checkbox';cb.checked=!!cfg.bj_soft17;cb.onchange=function(){cfg.bj_soft17=cb.checked;recalc()};sw.appendChild(cb);b.appendChild(sw);
  b.appendChild(info(function(){
    var ev=-0.005+0.43*(cfg.bj_win_payout-1)+0.0475*(cfg.bj_blackjack_payout-1.5)-(cfg.bj_soft17?0.002:0);
    return 'Ungefährer Erwartungswert pro Coin Einsatz bei guter Strategie: '+sgn(ev*100)+' % (klassisch 3:2 und Gewinn ×1 liegt bei etwa −0.5 %). Das ist eine Näherung, keine genaue Rechnung.';
  }));

  var h=sec('🏇 Pferderennen');
  h.appendChild(el('p','hint','5 Pferde. Quote = Auszahlung × Einsatz (Einsatz inklusive, abgerundet). Änderungen gelten ab dem nächsten Rennen, das der Server erzeugt.'));
  h.appendChild(listEditor(cfg.race_horses,[{key:'name',label:'Name',type:'text',max:20},{key:'color',label:'Farbe',type:'color'},{key:'weight',label:'Chance (%)',min:0,step:'0.1'},{key:'odds',label:'Quote ×',min:1.01,step:'0.1'}],null,true,recalc));
  h.appendChild(info(function(){return 'Summe der Chancen: '+r2(sum(cfg.race_horses))+' % (muss 100 sein) · Erwartungswert pro Wette: '+cfg.race_horses.map(function(x){return x.name+' '+sgn((x.weight/100*x.odds-1)*100)+' %'}).join(', ')+' (0 = ausgeglichen)'}));

  var errP=el('p','err');root.appendChild(errP);
  var sv=el('button',null,'Alle Einstellungen speichern');sv.style.width='100%';
  sv.onclick=async function(){
    errP.textContent='';
    var nums=[cfg.pool_threshold,cfg.pool_strength,cfg.wheel_stake,cfg.chest_stake,cfg.chest_bombs,cfg.bj_blackjack_payout,cfg.bj_win_payout];
    if(nums.some(isNaN))return errP.textContent='Bitte alle Felder mit Zahlen ausfüllen.';
    if(cfg.pool_threshold<1||cfg.pool_threshold>99)return errP.textContent='Die Bank-Schwelle muss zwischen 1 und 99 liegen.';
    if(cfg.pool_strength<0||cfg.pool_strength>30)return errP.textContent='Die Stärke muss zwischen 0 und 30 liegen.';
    if(cfg.wheel_stake<1||cfg.chest_stake<1)return errP.textContent='Die Einsätze müssen mindestens 1 sein.';
    if(cfg.wheel_fields.length<2||cfg.wheel_fields.some(function(f){return isNaN(f.payout)||f.payout<0||isNaN(f.weight)||f.weight<=0}))return errP.textContent='Glücksrad: Jedes Feld braucht eine Auszahlung (0 oder mehr) und eine Chance über 0.';
    if(Math.abs(sum(cfg.wheel_fields)-100)>0.01)return errP.textContent='Glücksrad: Die Chancen ergeben '+r2(sum(cfg.wheel_fields))+' %, sie müssen 100 % ergeben.';
    if(cfg.chest_bombs<1||cfg.chest_bombs>11)return errP.textContent='Truhen: Die Anzahl Bomben muss zwischen 1 und 11 liegen.';
    if(cfg.chest_values.length+cfg.chest_bombs!==12||cfg.chest_values.some(function(v){return isNaN(v)||v<1||v%1!==0}))return errP.textContent='Truhen: Werte (ganze Zahlen ab 1) plus Bomben müssen genau 12 ergeben.';
    if(cfg.slot_symbols.length<2||cfg.slot_symbols.some(function(f){return !f.symbol||isNaN(f.weight)||f.weight<=0||isNaN(f.mult)||f.mult<0}))return errP.textContent='Slot: Jedes Symbol braucht ein Zeichen, eine Chance über 0 und einen Gewinnfaktor (0 oder mehr).';
    if(Math.abs(sum(cfg.slot_symbols)-100)>0.01)return errP.textContent='Slot: Die Chancen ergeben '+r2(sum(cfg.slot_symbols))+' %, sie müssen 100 % ergeben.';
    if(cfg.race_horses.some(function(f){return !f.name||isNaN(f.weight)||f.weight<=0||isNaN(f.odds)||f.odds<1.01}))return errP.textContent='Pferde: Jedes Pferd braucht Name, Chance über 0 und Quote ab 1.01.';
    if(Math.abs(sum(cfg.race_horses)-100)>0.01)return errP.textContent='Pferde: Die Chancen ergeben '+r2(sum(cfg.race_horses))+' %, sie müssen 100 % ergeben.';
    sv.disabled=true;
    var r=await sb.rpc('admin_save_settings',{p_settings:cfg});
    sv.disabled=false;
    if(r.error)errP.textContent=errText(r.error);else{toast('Gespeichert');render()}
  };
  root.appendChild(sv);
  recalc();
}

/* ---------- Steuerung ---------- */
async function render(){
  runCleanup();
  if(!me)return renderAuth();
  try{
    if(tab==='home')await renderHome();
    else if(tab==='send'){await refreshMe();renderSend()}
    else if(tab==='hist')await renderHist();
    else if(tab==='rank')await renderRank();
    else if(tab==='games')await renderGames();
    else if(tab==='settings'){await refreshMe();renderSettings()}
    else if(tab==='admin'&&canAdmin())await renderAdmin();
    else{tab='home';await renderHome()}
  }catch(e){msg('Etwas ist schiefgelaufen. Bitte neu laden.')}
}
async function load(){
  if(loading)return;loading=true;
  var s=await sb.auth.getSession();
  if(!s.data.session){me=null;loading=false;runCleanup();return renderAuth()}
  var r=await sb.from('profiles').select('*').eq('id',s.data.session.user.id).single();
  if(r.error||!r.data){loading=false;me=null;return renderAuth()}
  me=r.data;loadSettings();
  try{await sb.rpc('race_state')}catch(e){}
  await refreshMe();
  loading=false;
  render();
}
if(SUPABASE_URL.indexOf('DEINE')===0){msg('Bitte zuerst die Supabase-Daten oben in der Datei eintragen.')}
else{
  sb.auth.onAuthStateChange(function(ev){
    if(ev==='SIGNED_OUT'){me=null;tab='home';gameView=null;runCleanup();music.pause();S=Object.assign({},DEFAULTS);applyTheme();renderAuth()}
    else if(ev==='SIGNED_IN'&&!me){load()}
  });
  load();
}
})();
</script>
